[package]
name = "piece-identify"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
rc_mutex = "deny"
mem_forget = "deny"
dbg_macro = "deny"
print_stdout = "warn"
clone_on_copy = "deny"
needless_collect = "warn"
